# --- Playback ---
SPACE cycle pause                # Play/Pause
s stop                          # Stop
q quit                          # Quit

# --- Seeking ---
RIGHT seek 10                   # → forward 10s
LEFT seek -10                   # ← backward 10s
UP seek 60                      # ↑ forward 1 min
DOWN seek -60                   # ↓ backward 1 min

# --- Volume ---
UP add volume 5                 # ↑ volume
DOWN add volume -5              # ↓ volume
m cycle mute                    # Mute

# --- Speed ---
] add speed 0.1                 # Faster
[ add speed -0.1                # Slower
= set speed 1.0                 # Normal speed

# --- Fullscreen ---
f cycle fullscreen

# --- Subtitles ---
v cycle sub                     # Toggle subtitles
b cycle sub-visibility
j sub-seek -1                   # Subtitle delay -
k sub-seek 1                    # Subtitle delay +

# --- Audio track ---
l cycle audio

# --- Screenshot ---
Shift+s screenshot

# --- Info (like VLC codec info) ---
i script-binding stats/display-stats-toggle

# --- Playlist ---
n playlist-next
p playlist-prev

# --- Frame step ---
e frame-step

# --- Aspect ratio ---
a cycle-values video-aspect "16:9" "4:3" "1.85:1" "2.35:1" "-1"
